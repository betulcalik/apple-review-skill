<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="440" viewBox="0 0 1720 440" role="img" aria-label="apple-review-skill">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101725"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22c55e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1720" height="440" rx="28" fill="url(#bg)"/>
  <rect x="120" y="106" width="1480" height="4" rx="2" fill="url(#glow)"/>

  <!-- checklist card -->
  <g transform="translate(140,120)">
    <rect width="300" height="220" rx="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#8b949e">
      <g transform="translate(32,56)">
        <rect x="0" y="-20" width="28" height="28" rx="7" fill="#0d4429" stroke="#22c55e" stroke-width="2"/>
        <path d="M7 -8 l5 6 l9 -12" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="48" y="1" fill="#8b949e">filter</text>
      </g>
      <g transform="translate(32,106)">
        <rect x="0" y="-20" width="28" height="28" rx="7" fill="#0d4429" stroke="#22c55e" stroke-width="2"/>
        <path d="M7 -8 l5 6 l9 -12" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="48" y="1" fill="#8b949e">report</text>
      </g>
      <g transform="translate(32,156)">
        <rect x="0" y="-20" width="28" height="28" rx="7" fill="#0d4429" stroke="#22c55e" stroke-width="2"/>
        <path d="M7 -8 l5 6 l9 -12" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="48" y="1" fill="#8b949e">block</text>
      </g>
      <g transform="translate(32,206)">
        <rect x="0" y="-20" width="28" height="28" rx="7" fill="#4a1420" stroke="#ef4444" stroke-width="2"/>
        <path d="M8 -14 l12 12 M20 -14 l-12 12" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
        <text x="48" y="1" fill="#f87171">contact</text>
      </g>
    </g>
  </g>

  <!-- title block -->
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="520" y="180" font-size="76" font-weight="700" fill="#e6edf3">apple-review-skill</text>
    <text x="524" y="238" font-size="30" fill="#8b949e">Audit your app against everything App Review</text>
    <text x="524" y="278" font-size="30" fill="#8b949e">has ever rejected apps for — before Apple does.</text>
  </g>

  <!-- chips -->
  <g font-family="SF Mono, ui-monospace, Menlo, monospace" font-size="24">
    <g transform="translate(524,320)">
      <rect width="216" height="46" rx="23" fill="#0d4429" stroke="#22c55e" stroke-width="1.5"/>
      <text x="108" y="31" text-anchor="middle" fill="#4ade80">Guidelines 1–5</text>
    </g>
    <g transform="translate(756,320)">
      <rect width="248" height="46" rx="23" fill="#0c2d4d" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="124" y="31" text-anchor="middle" fill="#93c5fd">UGC deep dive</text>
    </g>
    <g transform="translate(1020,320)">
      <rect width="272" height="46" rx="23" fill="#3b2a05" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="136" y="31" text-anchor="middle" fill="#fcd34d">real rejection cases</text>
    </g>
    <g transform="translate(1308,320)">
      <rect width="292" height="46" rx="23" fill="#2d1d3f" stroke="#c084fc" stroke-width="1.5"/>
      <text x="146" y="31" text-anchor="middle" fill="#d8b4fe">ITMS + appeals playbook</text>
    </g>
  </g>

  <text x="1600" y="392" text-anchor="end" font-family="SF Mono, ui-monospace, Menlo, monospace" font-size="22" fill="#6e7681">current through 2026-10-16</text>
</svg>
